[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dacar"
version = "1.0.0"
description = "Python implementation of Dacar, a Decentralized Access Control system for Reticulum"
readme = "README.md"
license = { text = "EUPL-1.2" }
requires-python = ">=3.9"
authors = [{ name = "Henri Bergius" }]
keywords = ["reticulum", "rns", "access-control", "authorization", "crdt", "mesh", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    # Same Ed25519 backend used by RNS (Reticulum Network Stack).
    "cryptography>=2.8",
    # Transport serialization (Dacar spec §5.3).
    "msgpack>=1.0",
    # Reticulum Network Stack. The `dacar` CLI keeps an RNS Identity in its
    # store, and the §8 Challenge / §11.2.4 identity-recall transport adapters
    # build on RNS. (The LXMF §11.2/§11.3 adapters stay opt-in below.)
    "rns>=1.4",
]

[project.scripts]
dacar = "dacar.cli:main"

[project.optional-dependencies]
transport = [
    # LXMF — §11.2 targeted Delta delivery + §11.3 Paper Messages.
    # The §8 RNS Challenge adapters use `rns`, which is a base dependency.
    "lxmf>=0.3",
]

[project.urls]
Homepage = "https://github.com/bergie/dacar"
Repository = "https://github.com/bergie/dacar"
Issues = "https://github.com/bergie/dacar/issues"
Specification = "https://github.com/bergie/dacar/blob/main/SPEC.md"
Changelog = "https://github.com/bergie/dacar/releases"

[tool.setuptools]
packages = ["dacar", "dacar.transport", "dacar.cli"]
