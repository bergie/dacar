; Dacar C++ implementation — PlatformIO configuration
;
; Native environment runs the Unity test suites under test/ against the
; CMake-fetched dependencies. Embedded environments build the library
; alongside microReticulum consumers (see the reference firmware).
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs =
	native

[env]
build_unflags =
	-std=gnu++11
	-fno-exceptions
build_flags =
	-std=gnu++17
	-fexceptions
	-Wall
	-Wno-missing-field-initializers
	-Wno-unused-parameter
lib_deps =
	microReticulum=https://github.com/attermann/microReticulum.git#40fa628809d57140180c1c833559ab96fec992c1
	microStore=https://github.com/attermann/microStore.git
	MsgPack=hideakitai/MsgPack@^0.4.2
	Crypto=https://github.com/attermann/Crypto.git
test_framework = unity
; Compile the library sources into the test runners
test_build_src = true

[env:native]
platform = native
build_flags =
	${env.build_flags}
	-DNATIVE
; Local checkout overrides for development (mirror the CMake *_SOURCE_DIR vars):
;   pio run -e native-local
[env:native-local]
platform = native
build_flags =
	${env.build_flags}
	-DNATIVE
lib_deps =
	${env.lib_deps}
	microReticulum=symlink://../../reticulum.js/microReticulum
lib_compat_mode = off

; Example embedded environments mirroring microReticulum's board set.
; Board/variant wiring for specific products (e.g. the LilyGO T1000-E) lives
; with the firmware project (microReticulum_Firmware), which consumes this
; library via lib_deps.
[env:embedded]
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_unflags =
	${env.build_unflags}
build_flags =
	${env.build_flags}
	-DMSGPACK_USE_BOOST=OFF

; ESP32-class (ttgo-lora32-v21)
[env:ttgo-lora32-v21]
extends = env:embedded
platform = espressif32
board = ttgo-lora32-v21
board_build.partitions = no_ota.csv
build_flags =
	${env:embedded.build_flags}
	-DBOARD_ESP32

; MCU: Nordic nRF52840 (32-bit ARM Cortex-M4, 64 MHz) — the constrained tier
; the T1000-E belongs to. SRAM 256 KB, 1 MB internal flash.
[env:nrf52840-dk-adafruit]
extends = env:embedded
platform = nordicnrf52
board = nrf52840_dk_adafruit
build_unflags =
	${env:embedded.build_unflags}
	-fno-exceptions    ; Required for exception handling on nordicnrf52
	-fno-rtti          ; Required for exception handling on nordicnrf52
	--specs=nano.specs ; Required for exception handling on nordicnrf52
build_flags =
	${env:embedded.build_flags}
	-fexceptions        ; Required for exception handling on nordicnrf52
	-frtti              ; Required for exception handling on nordicnrf52
	--specs=nosys.specs ; Required for exception handling on nordicnrf52
	-DBOARD_NRF52
	-DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_POOL_ALLOCATOR
	-DRNS_HEAP_POOL_BUFFER_SIZE=204800
lib_deps =
	${env:embedded.lib_deps}
	adafruit/Adafruit TinyUSB Library
