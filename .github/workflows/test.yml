# Dacar — cross-implementation test runner.
#
# The Makefile's `install` / `test` targets drive every implementation:
#
#   * Python:   `pip install -e .` + `unittest`
#   * JavaScript: `npm install` + the suite under node, deno, bun
#
# So a single job installs all four runtimes and then runs exactly what a
# contributor runs locally: `make install` then `make test`.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: make install && make test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: javascript/package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Installed runtimes
        run: |
          python3 --version
          node --version
          deno --version
          bun --version

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test
