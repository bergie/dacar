# Dacar — release publisher.
#
# Publishes all three artifacts when a `v*` tag is pushed, and can be triggered
# manually from the Actions tab (toggle "dry_run" to validate packaging without
# uploading anything).
#
#   * PyPI  build sdist+wheel (make release-python-dry) + upload via OIDC
#           trusted publishing (pypa/gh-action-pypi-publish). No API token.
#   * npm   npm publish --provenance with OIDC trusted publishing. The dist-tag is
#           derived from the version: prereleases (e.g. 1.2.0-rc.1) go to "rc",
#           stable releases to "latest".
#   * JSR   deno publish; JSR authenticates to this repo via GitHub OIDC.
#
# Before tagging, bump the version in all THREE configs in lockstep:
#   python/pyproject.toml, javascript/package.json, javascript/jsr.json
#
# One-time registry setup (see file header of each job below for details):
#   PyPI trusted publisher, npm trusted publisher (+ provenance for the org),
#   and link the @reticulum JSR scope to this repo.
#
# Releases assume the tagged commit already passed test.yml.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate packaging without uploading"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pypi:
    # Trusted publishing (OIDC). Configure once at https://pypi.org:
    #   Add a publisher  ->  GitHub  ->  owner: <this repo owner>,
    #   repository: <name>, workflow: release.yml, environment: (leave blank).
    name: PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel and validate metadata
        run: make release-python-dry

      - name: Publish to PyPI (OIDC trusted publishing)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  npm:
    # OIDC trusted publishing (no token). Configure once at https://www.npmjs.com:
    # @reticulum/dacar -> Settings -> Trusted Publisher -> GitHub ->
    # repository: <this repo>, workflow: release.yml, environment: (leave blank).
    name: npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install deps
        run: make install-js

      # npm publish defaults every publish to the "latest" dist-tag, so
      # prerelease versions (e.g. 1.2.0-rc.1) must be explicitly tagged "rc"
      # to avoid becoming the default install for everyone.
      - name: Determine npm dist-tag
        id: npm-tag
        run: |
          version=$(node -p "require('./javascript/package.json').version")
          if [[ $version == *-* ]]; then tag=rc; else tag=latest; fi
          echo "Publishing $version with dist-tag $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (provenance)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: make release-js NPM_DIST_TAG=${{ steps.npm-tag.outputs.tag }} NPM_PUBLISH_FLAGS="--access public --provenance"

      - name: Validate packaging (dry-run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: make release-js-dry

  jsr:
    # No token: JSR authenticates via GitHub OIDC. Link the @reticulum scope to
    # this repository once at https://jsr.io.
    name: JSR
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install deps
        run: cd javascript && deno install

      - name: Publish to JSR
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: make release-jsr

      - name: Validate packaging (dry-run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: make release-jsr-dry
